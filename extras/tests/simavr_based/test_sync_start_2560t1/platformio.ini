; PlatformIO Project Configuration File
;
; Sync-start test for ATmega2560 Timer1: verifies that two steppers
; started via synchronizedStart() produce synchronous pulses.

[platformio]

[common]
build_flags = -Werror -Wall

[env:atmega2560_timer1]
platform    = atmelavr
board       = megaatmega2560
framework   = arduino
build_flags = -Werror -Wall -DFAS_TIMER_MODULE=1 ${common.build_flags}
lib_extra_dirs = .