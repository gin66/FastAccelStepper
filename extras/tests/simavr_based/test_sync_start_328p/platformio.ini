; PlatformIO Project Configuration File
;
; Sync-start test for ATmega328P (Timer1): verifies that two steppers
; started via synchronizedStart() produce synchronous pulses.
;
; Note: FAS_TIMER_MODULE must be 1 for 328P (the only timer).

[platformio]

[common]
build_flags = -Werror -Wall

[env:atmega328p]
platform    = atmelavr
board       = nanoatmega328
framework   = arduino
build_flags = -Werror -Wall -DFAS_TIMER_MODULE=1 ${common.build_flags}
lib_extra_dirs = .