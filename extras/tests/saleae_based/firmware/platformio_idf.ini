[platformio]
default_envs = esp32_idf

[env:esp32_idf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32dev
framework = espidf
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
upload_speed = 921600
monitor_speed = 921600
build_flags = 
    -Wall
    -D ESP_IDF_VERSION_MAJOR=5
    -D ARDUINO_ARCH_ESP32
    -D SERIAL_BAUD=921600
lib_extra_dirs = .
platform_packages = 
    pioarduino/framework-esp32-ar @ https://github.com/pioarduino/arduino-esp32/releases/download/53.03.11/framework-esp32-ar-53.03.11.tar.gz