; PlatformIO project for the Saleae characterization app.
;
; The app logic lives in ../../common, shared by the Arduino and ESP-IDF entry
; points; this file only wires it up.
;
; src/ and FastAccelStepper/ are generated symlinks (see
; extras/tests/saleae_based/scripts/link_app.sh) so there is one copy of the
; firmware source. Create them once with:
;
;   bash extras/tests/saleae_based/scripts/link_app.sh
;
; then build with:
;   pio run -d extras/tests/saleae_based/apps/arduino -e saleae_avr
;   pio run -d extras/tests/saleae_based/apps/arduino -e saleae_esp32

[platformio]
default_envs = saleae_avr

[env:saleae_avr]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags = -Wall -Wextra -Wno-deprecated-declarations
lib_extra_dirs = .

; The AVR speed floor depends on how many steppers are connected, and step
; pins are restricted to the timer-capable pins, so the app is built for the
; 328P where those constraints actually bite.
[env:saleae_esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
build_flags = -Wall -Wextra -Wno-deprecated-declarations
lib_extra_dirs = .
