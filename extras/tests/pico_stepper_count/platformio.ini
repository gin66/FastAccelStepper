; Probe how many steppers an RP2350 can allocate.
;
; Build and flash:
;   pio run -d extras/tests/pico_stepper_count -t upload --upload-port /dev/cu.usbmodem4101
;
; Read the repeated PROBE line over the native USB serial port (115200):
;   python3 extras/tests/pico_stepper_count/read_probe.py
;
; The probe needs no logic analyzer and no motor. It only calls
; stepperConnectToPin() and reports the allocation count.

[platformio]
default_envs = rpipico2

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
build_flags = -D__FREERTOS=1
build_src_flags = -Werror -Wall -Wextra
lib_deps = symlink://../../..
monitor_speed = 115200
